[project]
name = "social-experiments"
version = "0.1.0"
description = "Do language-model agents respond to the stakes or the story, in copies of human social experiments?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabe Moraru" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-anthropic==1.7.6",
    "langchain-openai>=1.7.2",
    "matplotlib>=3.11.2",
]

[project.urls]
Repository = "https://github.com/GabeMoraru/social-experiments"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
social-experiments = "social_experiments.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
